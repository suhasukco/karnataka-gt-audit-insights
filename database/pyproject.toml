[project]
name = "gt-database"
version = "0.1.0"
description = "Shared SQLAlchemy models and Alembic migrations for the Karnataka GT platform warehouse."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gt_database*"]
